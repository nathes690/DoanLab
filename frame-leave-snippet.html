<!-- =====================================================================
     Paste this just before </body> in EVERY GitHub-hosted Proctor block.
     Change __FRAMEID__ to the file's own name, e.g. "Dl_04_explore".
     Reports the block's height to the Drupal page, and hands external
     link clicks up so the page-level dialog opens.
     ===================================================================== -->

<script>
(function () {
  "use strict";

  /* Hosts that count as "inside our site" — no dialog for these. */
  var INTERNAL_HOSTS = ["proctor.ucsf.edu"];

  /* This file's own name, so the parent can find the right iframe. */
  var FRAME_ID = "__FRAMEID__";

  function isInternal(host) {
    for (var i = 0; i < INTERNAL_HOSTS.length; i++) {
      if (host === INTERNAL_HOSTS[i]) { return true; }
      if (host.length > INTERNAL_HOSTS[i].length &&
          host.slice(-(INTERNAL_HOSTS[i].length + 1)) === "." + INTERNAL_HOSTS[i]) {
        return true;
      }
    }
    return false;
  }

  var framed = (window.parent !== window);
  var last = 0;

  /* Measure the CONTENT element, never the document or body — those report
     the viewport height when content is shorter, which makes the iframe
     grow a little on every message, forever. */
  function contentEl() {
    return document.querySelector(".doan-lab, .proctor-intl") ||
           document.body.firstElementChild;
  }

  function sendHeight() {
    if (!framed) { return; }
    var el = contentEl();
    if (!el) { return; }
    var h = Math.ceil(el.getBoundingClientRect().height);
    if (h < 1) { return; }
    if (Math.abs(h - last) < 2) { return; }   /* ignore sub-pixel jitter */
    last = h;
    try { window.parent.postMessage({ dlFrame: FRAME_ID, height: h }, "*"); } catch (e) {}
  }

  window.addEventListener("load", sendHeight);
  window.addEventListener("resize", function () { last = 0; sendHeight(); });
  document.addEventListener("click", function () { window.setTimeout(sendHeight, 60); });
  if (window.ResizeObserver) {
    var el = contentEl();
    if (el) { new ResizeObserver(sendHeight).observe(el); }
  }
  sendHeight();

  /* ---- hand external links up to the parent page ---- */
  document.addEventListener("click", function (e) {
    if (!framed) { return; }
    var a = e.target.closest ? e.target.closest("a") : null;
    if (!a) { return; }
    var href = a.getAttribute("href") || "";
    if (href.indexOf("http") !== 0) { return; }
    var host;
    try { host = new URL(href, window.location.href).hostname; }
    catch (err) { return; }
    if (isInternal(host)) { return; }
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) { return; }
    e.preventDefault();
    try { window.parent.postMessage({ plLeave: a.href }, "*"); } catch (err2) {}
  });
})();
</script>
